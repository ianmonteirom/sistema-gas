<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #0a0a0a; color: #ccc; font-family: 'Courier New', monospace;
  min-height: 100vh; display: flex; align-items: center; justify-content: center;
}
.container { width: 100%; max-width: 580px; padding: 28px 20px; }

.topbar {
  background: #1a1a1a; color: #888; padding: 10px 20px;
  display: flex; align-items: center; justify-content: space-between;
  font-family: 'Courier New', monospace; font-size: 13px; letter-spacing: 2px;
  margin-bottom: 0;
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
}
.conn-dot { width: 8px; height: 8px; border-radius: 50%; background: #444; display: inline-block; margin-right: 6px; transition: background .4s; }
.conn-dot.ok  { background: #00cc44; }
.conn-dot.err { background: #cc2200; }
.container { padding-top: 52px; }

.hdr { text-align: center; margin-bottom: 24px; border-bottom: 1px solid #1a1a1a; padding-bottom: 16px; }
.hdr .inst { font-size: 13px; letter-spacing: 5px; color: #555; margin-bottom: 6px; }
.hdr .ttl  { font-size: 15px; letter-spacing: 3px; color: #888; }

.cell-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.cell-card {
  background: #111; border: 1px solid #222; border-radius: 4px;
  padding: 14px 16px; cursor: pointer; transition: border-color .15s, background .15s;
  user-select: none; position: relative; overflow: hidden;
}
.cell-card:hover:not(.no-action) { border-color: #444; background: #181818; }
.cell-card.no-action { cursor: default; }
.cell-card.gas-operating { border-color: #005522; background: #00100a; }
.cell-card.gas-operating:hover:not(.no-action) { border-color: #008833; background: #001a0e; }
.cell-card.gas-absent { border-color: #554400; background: #0d0900; cursor: default; }
.cell-card.gas-absent:hover { border-color: #554400 !important; background: #0d0900; }
.cell-card.gas-disabled { border-color: #550000; background: #100000; cursor: default; }
.cell-card.gas-disabled:hover { border-color: #550000 !important; background: #100000; }
.cell-card.resolved-now { border-color: #007733 !important; background: #001a0a; }

.gas-oper-badge, .gas-abs-badge, .gas-dis-badge, .gas-done-badge {
  position: absolute; top: 8px; right: 8px;
  border-radius: 20px; font-size: 11px; font-weight: 700; padding: 3px 9px; letter-spacing: 1px;
}
.gas-oper-badge { background: #003a18; color: #00cc55; }
.gas-abs-badge  { background: #3a2800; color: #cc8800; }
.gas-dis-badge  { background: #3a0000; color: #cc3300; }
.gas-done-badge { background: #002a10; color: #00aa44; }
.c-id   { font-size: 13px; letter-spacing: 3px; color: #444; margin-bottom: 5px; }
.c-status { display: flex; align-items: center; gap: 7px; }
.sdot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.sdot.ok   { background: #00aa44; }
.sdot.warn { background: #cc8800; }
.sdot.crit { background: #cc2200; }
.sdot.lock { background: #333; }
.sdot.done { background: #00cc55; }
.stxt { font-size: 13px; letter-spacing: 1px; }
.stxt.ok   { color: #00aa44; }
.stxt.warn { color: #cc8800; }
.stxt.crit { color: #cc2200; }
.stxt.lock { color: #444; }
.stxt.done { color: #00cc55; }

#screen-puzzle { display: none; }
.back-btn {
  background: none; border: 1px solid #2a2a2a; color: #666;
  font-family: 'Courier New', monospace; font-size: 13px; letter-spacing: 2px;
  padding: 8px 18px; cursor: pointer; border-radius: 2px; margin-bottom: 22px;
  transition: border-color .15s, color .15s;
}
.back-btn:hover { border-color: #555; color: #aaa; }

.cell-title { text-align: center; margin-bottom: 22px; }
.cell-title .cid   { font-size: 13px; letter-spacing: 4px; color: #444; }
.cell-title .cinfo {
  font-size: 13px; color: #555; margin-top: 8px; line-height: 1.6;
  border: 1px solid #1a1a1a; border-radius: 3px; padding: 10px 14px; background: #0d0d0d;
}

.gauges { display: flex; gap: 20px; margin-bottom: 18px; }
.gauge { flex: 1; }
.gauge-label { display: flex; justify-content: space-between; align-items: center; margin-bottom: 7px; }
.gauge-label .name { font-size: 13px; letter-spacing: 2px; color: #777; }
.gauge-label .val  { font-size: 16px; font-weight: bold; color: #aaa; min-width: 44px; text-align: right; }
.gauge-track { height: 6px; background: #111; border-radius: 3px; overflow: hidden; }
.gauge-fill  { height: 100%; border-radius: 3px; transition: width .4s, background .4s; }

.status-box {
  text-align: center; margin-bottom: 20px; padding: 13px 16px;
  background: #0d0d0d; border: 1px solid #1a1a1a; border-radius: 4px;
}
.status-lbl { font-size: 14px; letter-spacing: 3px; transition: color .3s; }
.status-sub { font-size: 13px; letter-spacing: 1px; color: #555; margin-top: 5px; transition: color .3s; }

.controls { display: flex; flex-direction: column; gap: 12px; margin-bottom: 18px; }
.ctrl-row {
  background: #0d0d0d; border: 1px solid #1a1a1a; border-radius: 4px; padding: 14px 16px;
}
.ctrl-lbl  { font-size: 13px; letter-spacing: 3px; color: #444; margin-bottom: 6px; }
.ctrl-desc { font-size: 13px; color: #555; margin-bottom: 10px; letter-spacing: 0.5px; line-height: 1.5; }
.btn-group { display: flex; gap: 6px; flex-wrap: wrap; }
.sbtn {
  flex: 1; padding: 10px 12px; background: #111; border: 1px solid #2a2a2a;
  color: #555; font-family: 'Courier New', monospace; font-size: 13px; letter-spacing: 2px;
  cursor: pointer; border-radius: 2px; transition: all .15s; min-width: 80px;
}
.sbtn:hover { border-color: #444; color: #999; }
.sbtn.active-open   { border-color: #00aa44; color: #00cc44; background: #001408; }
.sbtn.active-closed { border-color: #cc5500; color: #ee6600; background: #1a0800; }
.sbtn.active-mode   { border-color: #2255aa; color: #4488cc; background: #050f20; }

.confirm-btn {
  width: 100%; padding: 15px; background: #0d0d0d; border: 1px solid #2a2a2a;
  color: #555; font-family: 'Courier New', monospace; font-size: 13px; letter-spacing: 4px;
  cursor: pointer; border-radius: 2px; transition: all .2s;
}
.confirm-btn:hover { border-color: #444; color: #888; }
.confirm-btn.ready { border-color: #00aa44; color: #00cc55; background: #001408; }

.cell-ok-msg {
  display: none; position: fixed; inset: 0; background: rgba(0,15,5,0.93);
  align-items: center; justify-content: center; flex-direction: column; gap: 14px;
  animation: fadeIn .3s ease;
}
.cell-ok-msg.show { display: flex; }
@keyframes fadeIn { from{opacity:0} to{opacity:1} }
.csm-icon  { font-size: 52px; color: #00cc44; }
.csm-title { font-size: 14px; letter-spacing: 4px; color: #00aa44; }
.csm-cell  { font-size: 13px; color: #005533; letter-spacing: 2px; }
.csm-btn {
  margin-top: 10px; padding: 10px 28px; background: none; border: 1px solid #00994d;
  color: #00aa44; font-family: 'Courier New', monospace; font-size: 11px; letter-spacing: 3px;
  cursor: pointer; border-radius: 2px; transition: background .15s;
}
.csm-btn:hover { background: #001a0a; }

.success-screen {
  display: none; position: fixed; inset: 0; background: #020f05;
  align-items: center; justify-content: center; flex-direction: column; gap: 20px;
}
.success-screen.show { display: flex; }
.s-icon  { font-size: 64px; color: #00cc44; }
.s-title { font-size: 13px; letter-spacing: 5px; color: #00aa33; }
.s-lines { display: flex; flex-direction: column; gap: 8px; text-align: center; }
.s-line     { font-size: 11px; letter-spacing: 2px; color: #00aa55; }
.s-line.dim { font-size: 11px; letter-spacing: 2px; color: #004422; }

      'open|normal|open':   {press:70,flux:80, lbl:'CIRCUITO ABERTO',   sub:'Sem perfil ativo. Protocolo padrão — CQ-4 distribuído sem calibração.'},
      'closed|iso|open':    {press:30,flux:18, lbl:'ISOLAMENTO PARCIAL',sub:'V2 ainda aberta. Isolar completamente antes de confirmar.'},
      'open|iso|closed':    {press:40,flux:22, lbl:'ISOLAMENTO PARCIAL',sub:'V1 ainda aberta. Fechar para completar o isolamento.'},
      'open|emerg|open':    {press:88,flux:120,lbl:'SOBRECARGA',        sub:'Emergência sem perfil identificado: risco de colapso do circuito.'},
      'closed|iso|closed':  {press:62,flux:58, lbl:'NOMINAL',           sub:'Circuito isolado. CQ-4 suspenso até identificação do sujeito.'}
    }
  },
  {
    id:'S-10',
    sk:'warn', st:'DESVIO DETECTADO',
    info:'Rotina de calibração periódica detectou desvio de configuração. Sistema fora do padrão de longa permanência.',
    target:{v1:'open',mode:'normal',v2:'closed'},
    start:{v1:'open',mode:'recirc',v2:'open'},
    modes:[['NORMAL','normal'],['RECIRCULAÇÃO','recirc'],['ISOLAMENTO','iso']],
    v1d:'Válvula principal — operação contínua há 8 anos.',
    v2d:'Válvula de retorno — aberta indevidamente durante última manutenção.',
    modedesc:'NORMAL restaura configuração padrão de longa permanência.',
    states:{
      'open|recirc|open':   {press:55,flux:95, lbl:'DESVIO OPERACIONAL',  sub:'Recirculação ativa com V2 aberta. Consumo elevado.'},
      'open|recirc|closed': {press:58,flux:80, lbl:'RECIRCULAÇÃO ATIVA',  sub:'Recirculação ainda ativa. Retornar ao modo normal.'},
      'open|iso|closed':    {press:38,flux:22, lbl:'ISOLAMENTO INDEVIDO', sub:'Modo de isolamento inadequado para longa permanência.'},
      'closed|normal|closed':{press:15,flux:8, lbl:'SUBCARGA',            sub:'V1 fechada. Fluxo insuficiente para sujeito ativo.'},
      'open|normal|open':   {press:68,flux:75, lbl:'AJUSTE INCOMPLETO',   sub:'Modo normalizado mas V2 ainda aberta.'},
      'open|normal|closed': {press:62,flux:58, lbl:'NOMINAL',             sub:'Configuração padrão restaurada. Sistema calibrado.'}
    }
  },
  {
    id:'S-11',
    sk:'ok', st:'NOMINAL', autoResolve:true,
    info:'Sujeito não localizado na instalação. CQ-4 desativado automaticamente por protocolo de cela vazia.',
    target:{v1:'closed',mode:'normal',v2:'closed'},
    start:{v1:'closed',mode:'normal',v2:'closed'},
    modes:[['NORMAL','normal'],['RECIRCULAÇÃO','recirc'],['ISOLAMENTO','iso']],
    v1d:'Fechada — cela vazia, sem sujeito ativo.',
    v2d:'Fechada — sistema desativado.',
    modedesc:'Sistema inativo por ausência de sujeito.',
    states:{}
  },
  {
    id:'S-V', gasDisplay:'disabled',
    sk:'lock', st:'BLOQUEADO — NÍVEL Ω', autoResolve:true,
    info:'Acesso ao subsistema de ventilação desta cela requer autorização nível Ω. Interface bloqueada por protocolo D-0.',
    target:{v1:'closed',mode:'purge',v2:'open'},
    start:{v1:'open',mode:'normal',v2:'closed'},
    modes:[['NORMAL','normal'],['PURGAMENTO','purge'],['LOCKDOWN','lock']],
    v1d:'Entrada principal — BLOQUEADA por Protocolo D-0.',
    v2d:'Válvula de purga — BLOQUEADA por Protocolo D-0.',
    modedesc:'PURGAMENTO substitui o gás residual por ar neutro.',
    states:{
      'closed|purge|open':  {press:62,flux:58,lbl:'NOMINAL',sub:'Purgamento ativo. Câmara estabilizada.'},
      'open|lock|closed':   {press:0, flux:0, lbl:'LOCKDOWN ATIVO',sub:'Sistema em lockdown total. Nenhuma ação possível.'},
      'open|normal|closed': {press:88,flux:100,lbl:'SOBREPRESSÃO',sub:'V1 aberta sem purga ativa. Estado perigoso.'}
    }
  }
];

var cellStates   = {};
var cellResolved = {};
var currentIdx   = -1;
var mainSolved   = false;
var fbLoaded     = false;

// Init local states from CELLS.start
CELLS.forEach(function(c,i){
  cellStates[i] = {v1:c.start.v1, mode:c.start.mode, v2:c.start.v2};
  cellResolved[i] = false;
});

// ── Firebase: listen for gas state changes (real-time) ──────────────────────
db.ref(REF+'/gas').on('value', function(snap){
  var data = snap.val() || {};
  CELLS.forEach(function(c,i){
    if(data[c.id] === true || c.autoResolve){
      cellResolved[i] = true;
    }
  });
  fbLoaded = true;
  // If currently viewing puzzle for a cell that's now resolved externally, go back
  if(currentIdx >= 0 && cellResolved[currentIdx]){
    goBack();
  } else {
    renderGrid();
  }
});

// ── Write resolved cell to Firebase ─────────────────────────────────────────
function saveResolved(id){
  db.ref(REF+'/gas/'+id).set(true);
}

// ── Write autoResolve cells on first load ───────────────────────────────────
// (only after fb is connected, and only once)
db.ref('.info/connected').once('value', function(snap){
  if(snap.val()){
    CELLS.forEach(function(c){
      if(c.autoResolve){
        db.ref(REF+'/gas/'+c.id).set(true);
      }
    });
  }
});

// ────────────────────────────────────────────────────────────────────────────

function renderGrid(){
  var grid = document.getElementById('cell-grid');
  grid.innerHTML = '';
  CELLS.forEach(function(c,i){
    var resolved = cellResolved[i];
    var card = document.createElement('div');
    var html, cls;

    if(c.gasDisplay === 'absent'){
      // S-4: sem CQ-4 — amarelo
      cls = 'cell-card no-action gas-absent';
      html = '<div class="c-id">'+c.id+'</div>'+
             '<div class="c-status"><div class="sdot warn"></div><div class="stxt warn">SEM GÁS</div></div>'+
             '<div class="gas-abs-badge">Sem gás</div>';

    } else if(c.gasDisplay === 'disabled'){
      // S-8, S-V: gás desativado — vermelho
      cls = 'cell-card no-action gas-disabled';
      html = '<div class="c-id">'+c.id+'</div>'+
             '<div class="c-status"><div class="sdot lock"></div><div class="stxt lock">DESATIVADO</div></div>'+
             '<div class="gas-dis-badge">Gás desativado</div>';

    } else if(resolved && !c.autoResolve){
      // Célula resolvida pelo jogador — CQ-4 neutralizado
      cls = 'cell-card no-action resolved-now';
      html = '<div class="c-id">'+c.id+'</div>'+
             '<div class="c-status"><div class="sdot done"></div><div class="stxt done">CQ-4 NOMINAL</div></div>'+
             '<div class="gas-done-badge">Neutralizado</div>';

    } else {
      // Gás operando (autoResolve ou ainda não resolvido)
      var noClick = c.autoResolve;
      cls = 'cell-card gas-operating' + (noClick ? ' no-action' : '');
      html = '<div class="c-id">'+c.id+'</div>'+
             '<div class="c-status"><div class="sdot ok"></div><div class="stxt ok">GÁS OPERANDO</div></div>'+
             '<div class="gas-oper-badge">Gás operando</div>';
      if(!noClick){ (function(idx){ card.onclick = function(){ openCell(idx); }; })(i); }
    }

    card.className = cls;
    card.innerHTML = html;
    grid.appendChild(card);
  });
}

function openCell(idx){
  if(cellResolved[idx]) return;
  currentIdx = idx;
  var c = CELLS[idx];
  document.getElementById('screen-select').style.display = 'none';
  document.getElementById('screen-puzzle').style.display = 'block';
  document.getElementById('p-cid').textContent   = c.id;
  document.getElementById('p-cinfo').textContent = c.info;
  document.getElementById('v1-desc').textContent   = c.v1d;
  document.getElementById('v2-desc').textContent   = c.v2d;
  document.getElementById('mode-desc').textContent = c.modedesc;

  var mb = document.getElementById('mode-btns');
  mb.innerHTML = '';
  c.modes.forEach(function(m){
    var btn = document.createElement('button');
    btn.className = 'sbtn';
    btn.id = 'mode-'+m[1];
    btn.textContent = m[0];
    (function(key){ btn.onclick = function(){ setCtrl('mode',key); }; })(m[1]);
    mb.appendChild(btn);
  });

  cellStates[idx] = {v1:c.start.v1, mode:c.start.mode, v2:c.start.v2};
  updatePuzzle();
}

function goBack(){
  document.getElementById('screen-select').style.display = 'block';
  document.getElementById('screen-puzzle').style.display = 'none';
  currentIdx = -1;
  renderGrid();
}

function setCtrl(ctrl,val){
  if(currentIdx<0) return;
  cellStates[currentIdx][ctrl] = val;
  updatePuzzle();
}

function computeState(c,s){
  var key = s.v1+'|'+s.mode+'|'+s.v2;
  if(c.states && c.states[key]) return c.states[key];
  var t = c.target;
  var sc = (s.v1===t.v1?1:0) + (s.mode===t.mode?1:0) + (s.v2===t.v2?1:0);
  if(sc===3) return {press:62,flux:58,lbl:'NOMINAL',sub:'Sistema estabilizado.'};
  if(sc===2) return {press:48,flux:75,lbl:'AJUSTE INCOMPLETO',sub:'Um parâmetro fora do valor ideal.'};
  if(sc===1) return {press:30,flux:100,lbl:'DIVERGÊNCIA',sub:'Configuração incorreta. Dois parâmetros errados.'};
  return {press:15,flux:20,lbl:'FALHA',sub:'Configuração inválida. Sistema em estado de erro.'};
}

function updatePuzzle(){
  if(currentIdx<0) return;
  var c = CELLS[currentIdx];
  var s = cellStates[currentIdx];
  var st = computeState(c,s);
  var ok = st.lbl==='NOMINAL';

  var p = Math.min(st.press,100), f = Math.min(st.flux,100);
  var pc = ok ? '#00aa44' : (st.press>80?'#cc2200': (st.press<30?'#cc6600':'#cc8800'));
  var fc = ok ? '#00aa44' : (st.flux>100?'#cc2200':(st.flux<30?'#cc6600':'#cc8800'));
  document.getElementById('g-press').textContent = st.press+'%';
  document.getElementById('g-flux').textContent  = st.flux+'%';
  document.getElementById('gf-press').style.width      = p+'%';
  document.getElementById('gf-press').style.background = pc;
  document.getElementById('gf-flux').style.width       = f+'%';
  document.getElementById('gf-flux').style.background  = fc;

  document.getElementById('s-lbl').textContent  = st.lbl;
  document.getElementById('s-lbl').style.color  = ok ? '#00cc44' : '#cc5500';
  document.getElementById('s-sub').textContent  = st.sub;
  document.getElementById('s-sub').style.color  = ok ? '#006633' : '#555';

  document.getElementById('v1-open').className   = 'sbtn'+(s.v1==='open'?' active-open':'');
  document.getElementById('v1-closed').className = 'sbtn'+(s.v1==='closed'?' active-closed':'');

  c.modes.forEach(function(m){
    var btn = document.getElementById('mode-'+m[1]);
    if(btn) btn.className = 'sbtn'+(s.mode===m[1]?' active-mode':'');
  });

  document.getElementById('v2-open').className   = 'sbtn'+(s.v2==='open'?' active-open':'');
  document.getElementById('v2-closed').className = 'sbtn'+(s.v2==='closed'?' active-closed':'');

  document.getElementById('confirm-btn').className = 'confirm-btn'+(ok?' ready':'');
}

function confirmConfig(){
  if(currentIdx<0) return;
  var c = CELLS[currentIdx];
  var s = cellStates[currentIdx];
  var st = computeState(c,s);
  if(st.lbl!=='NOMINAL') return;

  cellResolved[currentIdx] = true;
  saveResolved(c.id);  // write to Firebase → propagates to celas.html in real-time

  if(c.critical && !mainSolved){
    mainSolved = true;
    setTimeout(function(){ document.getElementById('successSc').classList.add('show'); }, 400);
    return;
  }

  document.getElementById('csm-title').textContent = 'CQ-4 DESATIVADO — '+c.id;
  document.getElementById('csm-cell').textContent  = c.id+' | GÁS NOMINAL — CELA LIBERADA';
  document.getElementById('cell-ok-msg').classList.add('show');
}

function closeCellOk(){
  document.getElementById('cell-ok-msg').classList.remove('show');
  goBack();
}

renderGrid();
</script>
</body>
</html>
